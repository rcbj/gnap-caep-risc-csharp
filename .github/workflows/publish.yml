name: publish

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time: each reads the version the one before it took.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # The test workflow has already succeeded for this commit on main. Release
    # only when that commit is a pull request merged into main; a direct push
    # stays unreleased. .github/scripts/release_decision.py picks the version:
    # VERSION when it is ahead of what is published, one patch higher when the
    # shipped files changed since the last release's tag, and otherwise no
    # release at all, so a change to tests, the demo, or the docs ships nothing.
    # The version is written into this workspace only and is never committed.
    #
    # The API key comes from nuget.org Trusted Publishing: NuGet/login trades
    # this job's GitHub OIDC token for a key that lasts one hour. nuget.org must
    # hold a policy for this repository and publish.yml, and the NUGET_USER
    # secret is the profile name that owns it.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      PROJECT: src/IyaSec.GnapCaepRisc/IyaSec.GnapCaepRisc.csproj
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Every tag: the last release's tag is what the decision compares with.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a release
        id: decide
        if: steps.gate.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 .github/scripts/release_decision.py decide nuget IyaSec.GnapCaepRisc "$SHA" src/IyaSec.GnapCaepRisc

      - name: Pack the library
        id: pack
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -eu
          mkdir -p artifacts
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet pack "$PROJECT" -c Release -o /src/artifacts \
              -p:ContinuousIntegrationBuild=true -p:Version="$VERSION"
          package=$(ls artifacts/*.nupkg)
          case "$package" in
            *"$VERSION.nupkg") echo "package=$package" >> "$GITHUB_OUTPUT" ;;
            *) echo "expected one package of $VERSION, found $package"; exit 1 ;;
          esac

      - name: Trade the OIDC token for a nuget.org API key
        id: login
        if: steps.decide.outputs.release == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the package
        if: steps.decide.outputs.release == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE: ${{ steps.pack.outputs.package }}
        run: |
          set -eu
          docker run --rm \
            -v "$PWD/artifacts":/src/artifacts \
            -w /src \
            -e NUGET_API_KEY \
            -e PACKAGE \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            sh -c 'dotnet nuget push "$PACKAGE" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json'

      # Publishing and this step are one release: the tag it creates is the
      # baseline the next decision compares with.
      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes
