services:
  gnap-demo:
    build: .
    image: gnap-caep-risc-csharp-demo
    network_mode: host
    environment:
      PORT: ${PORT:-3000}
    volumes:
      - ./demo/generated/client.key:/app/demo/generated/client.key:ro
      - ./demo/generated/client.crt:/app/demo/generated/client.crt:ro
    stop_grace_period: 5s
